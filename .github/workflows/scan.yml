name: Portal Scanner

on:
  schedule:
    # Runs at 12:00 AM and 12:00 PM Central Daylight Saving Time (CDT / UTC-5)
    - cron: '0 5,17 * * *'
  workflow_dispatch:       # Allows manual trigger from the Actions tab
    inputs:
      reset_cache:
        description: 'Ignore previous scan history and rescan all portals'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

permissions:
  contents: read

concurrency:
  group: career-ops-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install --ignore-scripts

      # Restore scan history from previous runs so scan.mjs deduplicates already-seen jobs
      - name: Restore scan history from cache
        if: ${{ github.event.inputs.reset_cache != 'true' }}
        uses: actions/cache/restore@v4
        with:
          path: |
            data/pipeline.md
            data/scan-history.tsv
            data/scan-runs.tsv
          key: career-ops-scan-data-${{ github.run_id }}
          restore-keys: |
            career-ops-scan-data-

      # Inject portals.yml (and optional profile.yml) into the runner without committing
      - name: Write portals.yml from Secret
        env:
          PORTALS_YML: ${{ secrets.PORTALS_YML }}
          PROFILE_YML: ${{ secrets.PROFILE_YML }}
        run: |
          set +x
          if [ -z "$PORTALS_YML" ]; then
            echo "::error::Secret PORTALS_YML is not set. Add it in Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          mkdir -p data config
          printenv PORTALS_YML > portals.yml
          if [ -n "$PROFILE_YML" ]; then
            printenv PROFILE_YML > config/profile.yml
          fi

      - name: Run Portal Scanner
        run: |
          # Dynamically calculate the date 7 days ago in YYYY-MM-DD format
          SEVEN_DAYS_AGO=$(date -d "7 days ago" +%Y-%m-%d)
          
          # Pass the parameter directly to scan.mjs
          node scan.mjs --posted-after "$SEVEN_DAYS_AGO"

      # Shred portals.yml immediately after scanning
      - name: Remove temporary secret files
        if: always()
        run: rm -f portals.yml config/profile.yml

      # Save updated data/pipeline.md & scan history into cache for the next run
      - name: Save updated scan history to cache
        uses: actions/cache/save@v4
        with:
          path: |
            data/pipeline.md
            data/scan-history.tsv
            data/scan-runs.tsv
          key: career-ops-scan-data-${{ github.run_id }}

      # Render high-level status in GitHub Step Summary (no sensitive job details exposed)
      - name: Publish Scan Status to Step Summary
        run: |
          if [ -f data/pipeline.md ]; then
            count=$(grep -c '^- \[ \]' data/pipeline.md 2>/dev/null || echo 0)
            echo "## 📋 Portal Scanner Status" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "- ✅ Scan completed successfully." >> "$GITHUB_STEP_SUMMARY"
            echo "- 📬 Total pending opportunities: **$count**" >> "$GITHUB_STEP_SUMMARY"
            echo "- 📧 Email notification triggered." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No \`data/pipeline.md\` generated." >> "$GITHUB_STEP_SUMMARY"
          fi

      # Send private email digest and attach pipeline.md via Resend API
      - name: Send Email Digest via Resend
        if: always()
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          NOTIFICATION_EMAIL: ${{ secrets.NOTIFICATION_EMAIL }}
        run: |
          if [ -z "$RESEND_API_KEY" ] || [ -z "$NOTIFICATION_EMAIL" ]; then
            echo "::warning::RESEND_API_KEY or NOTIFICATION_EMAIL secret is not set. Skipping email dispatch."
            exit 0
          fi

          if [ -f data/pipeline.md ]; then
            node --input-type=module -e '
              import fs from "node:fs";

              const content = fs.readFileSync("data/pipeline.md", "utf8");
              const count = (content.match(/^- \[ \]/gm) || []).length;
              const base64Attachment = Buffer.from(content).toString("base64");

              const pendingSection = content.split(/^##\s+(?:Procesadas|Processed)/im)[0] || content;
              const pendingLines = pendingSection
                .split("\n")
                .filter(l => l.startsWith("- [ ]"))
                .slice(0, 15)
                .map(l => l.replace(/^- \[ \] /, "• "))
                .join("\n");

              const emailBody = `Career-Ops Portal Scan Completed!\n\n` +
                `Total pending opportunities in pipeline: ${count}\n\n` +
                (count > 0 ? `Recent matches preview:\n${pendingLines}\n\n` : "") +
                `The full pipeline.md file is attached to this email.`;

              try {
                const res = await fetch("https://api.resend.com/emails", {
                  method: "POST",
                  headers: {
                    "Authorization": `Bearer ${process.env.RESEND_API_KEY}`,
                    "Content-Type": "application/json"
                  },
                  body: JSON.stringify({
                    from: "Career-Ops Scanner <onboarding@resend.dev>",
                    to: [process.env.NOTIFICATION_EMAIL],
                    subject: `Career-Ops Daily Digest: ${count} New Opportunities`,
                    text: emailBody,
                    attachments: [
                      {
                        filename: "pipeline.md",
                        content: base64Attachment
                      }
                    ]
                  })
                });

                if (res.ok) {
                  console.log("Email digest sent successfully via Resend.");
                } else {
                  const errorText = await res.text();
                  console.error("Resend API failed with status:", res.status, errorText);
                }
              } catch (err) {
                console.error("Failed to connect to Resend API (network error).");
              }
            '
          fi
