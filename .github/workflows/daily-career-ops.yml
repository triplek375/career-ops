name: Daily Career-Ops Pipeline

on:
  schedule:
    # Runs at minute 0 past every 6th hour (00:00, 06:00, 12:00, and 18:00 UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch: # Allows you to trigger it manually from the Actions tab

concurrency:
  group: career-ops-gdrive-sync
  cancel-in-progress: false

jobs:
  run-career-ops:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: 1. Checkout Forked Repository
        uses: actions/checkout@v4

      - name: 2. Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 3. Install Dependencies & Playwright Chromium (for PDF Resumes)
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: 4. Configure rclone for Google Drive Worker
        env:
          GDRIVE_SA_KEY: ${{ secrets.GDRIVE_SA_KEY }}
        run: |
          sudo apt-get update && sudo apt-get install -y rclone
          mkdir -p /tmp/secrets
          echo "$GDRIVE_SA_KEY" > /tmp/secrets/sa-key.json

      - name: 5. Pull Personal Inputs & State from Google Drive
        env:
          RCLONE_CONFIG_GDRIVE_TYPE: drive
          RCLONE_CONFIG_GDRIVE_SCOPE: drive
          RCLONE_CONFIG_GDRIVE_ROOT_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
          RCLONE_CONFIG_GDRIVE_SERVICE_ACCOUNT_FILE: /tmp/secrets/sa-key.json
        run: |
          mkdir -p config data jds reports output batch/tracker-additions
          rclone copy gdrive:cv.md ./ || true
          rclone copy gdrive:portals.yml ./ || true
          rclone copy gdrive:config/ ./config/ || true
          rclone copy gdrive:data/ ./data/ || true
          rclone copy gdrive:jds/ ./jds/ || true
          rclone copy gdrive:reports/ ./reports/ || true

      - name: 6. Scan Job Boards & Check Liveness (Zero Tokens)
        run: |
          node scan.mjs --apply-defaults
          node check-liveness.mjs
          node dedup-tracker.mjs

      - name: 7. Run Gemini Batch Evaluation & Tailored PDF Generation
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-2.5-flash
        run: |
          # Evaluates pending jobs in data/pipeline.md, scores them, and writes reports/
          node batch-evaluate-gemini.mjs --limit 20
          
          # Merges newly evaluated jobs into data/applications.md
          node merge-tracker.mjs
          
          # Generates tailored HTML + PDF resumes in output/ for top-scoring roles
          node batch-tailor.mjs --min-score 4.0 --limit 5 || true

      - name: 8. Run Agentic Workflow (Optional via Official Gemini CLI)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          # Uses GEMINI.md and .agents/skills/career-ops/SKILL.md for agentic analysis
          gemini -p "Read data/applications.md and reports/, then run node analyze-patterns.mjs and write a daily summary of the top 3 roles to data/daily-brief.md" --yolo || true

      - name: 9. Push All Outputs Back to Google Drive
        if: always()
        env:
          RCLONE_CONFIG_GDRIVE_TYPE: drive
          RCLONE_CONFIG_GDRIVE_SCOPE: drive
          RCLONE_CONFIG_GDRIVE_ROOT_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
          RCLONE_CONFIG_GDRIVE_SERVICE_ACCOUNT_FILE: /tmp/secrets/sa-key.json
        run: |
          rclone copy ./data/ gdrive:data/
          rclone copy ./jds/ gdrive:jds/
          rclone copy ./reports/ gdrive:reports/
          rclone copy ./output/ gdrive:output/
          rm -f /tmp/secrets/sa-key.json
